<app-auth-layout>
  <form class="form-login">
    <div id="title-of-form">
      <a routerLink="/dang-nhap">&lt; Quay laị</a>
      <h3>Quên mật khẩu</h3>
    </div>
    <img src="assets/imgs/qmk-1.png" alt="" />
    <h2>Bạn đã quên mật khẩu?</h2>
    <p>Đừng lo lắng, hãy nhập tài khoản hoặc email của bạn ở dưới để tìm kiếm tài khoản của bạn</p>

    <div class="form">
      <input type="text" placeholder="Nhập tài khoản/email" />
      <button class="btn-continue" type="submit">Tiếp tục </button>
    </div>
  </form>
</app-auth-layout>
