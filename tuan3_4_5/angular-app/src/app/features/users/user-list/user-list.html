<div class="page">
  <header class="page-header">
    <div>
      <h1>Danh sách người dùng</h1>
      <p class="subtitle">Quản lý thông tin người dùng trong hệ thống</p>
    </div>
    <div class="header-actions">
      <a nz-button nzType="primary" routerLink="/users/add">+ Thêm người dùng</a>
      <button nz-button type="button" (click)="logout()">Đăng xuất</button>
    </div>
  </header>

  @if (errorMessage()) {
    <nz-alert nzType="error" [nzMessage]="errorMessage()" nzShowIcon></nz-alert>
  }

  <div class="search-bar">
    <input
      nz-input
      type="search"
      [formControl]="searchControl"
      placeholder="Tìm theo tên người dùng..."
      aria-label="Tìm theo tên người dùng"
    />
  </div>

  <nz-card class="table-card" [nzBodyStyle]="{ padding: '0' }">
    <nz-table
      #userTable
      [nzData]="filteredUsers()"
      [nzLoading]="isLoading()"
      [nzFrontPagination]="false"
      [nzShowPagination]="false"
      [nzScroll]="{ x: '720px' }"
    >
      <thead>
        <tr>
          <th>Avatar</th>
          <th>Email</th>
          <th>First name</th>
          <th>Last name</th>
          <th class="actions-col">Hành động</th>
        </tr>
      </thead>
      <tbody>
        @for (user of userTable.data; track user.id) {
          <tr>
            <td><nz-avatar [nzSrc]="user.avatar" [nzAlt]="user.firstName"></nz-avatar></td>
            <td>{{ user.email }}</td>
            <td>{{ user.firstName }}</td>
            <td>{{ user.lastName }}</td>
            <td class="actions-col">
              <a nz-button nzType="link" [routerLink]="['/users/edit', user.id]">Sửa</a>
              <button
                nz-button
                nzType="link"
                nzDanger
                nz-popconfirm
                nzPopconfirmTitle="Bạn có chắc muốn xóa người dùng này?"
                nzOkText="Xóa"
                nzCancelText="Hủy"
                type="button"
                [disabled]="deletingId() === user.id"
                [nzLoading]="deletingId() === user.id"
                (nzOnConfirm)="removeUser(user.id)"
              >
                Xóa
              </button>
            </td>
          </tr>
        }
      </tbody>
    </nz-table>
  </nz-card>

  <div class="pagination">
    <nz-pagination
      [nzPageIndex]="page() + 1"
      [nzTotal]="total()"
      [nzPageSize]="pageSize"
      [nzShowSizeChanger]="false"
      (nzPageIndexChange)="goToPage($event)"
    ></nz-pagination>
  </div>
</div>
