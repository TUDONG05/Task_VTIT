<app-auth-layout>
  <form class="form-login">
    <div id="title-of-form">
      <a routerLink="/dang-nhap">&lt; Quay laị</a>
      <h3>Đổi mật khẩu</h3>
    </div>
    <img src="assets/imgs/qmk-1.png" alt="" />
    <h2>Đăng nhập lần đầu</h2>
    <p>Đây là lần đầu tiên đăng nhập của bạn, bước đầu tiên bạn cần đổi mật khẩu để đảm bảo tính bảo mật cho tài khoản</p>

    <div class="form">
      <input type="text" placeholder="Nhập mật khẩu mới" />
      <input type="text" placeholder="Nhập lại mật khẩu mới" />
      <button class="btn-continue" type="submit">Tiếp tục </button>
    </div>
  </form>
</app-auth-layout>
