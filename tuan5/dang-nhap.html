<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="dang-ky.css">
    <link rel="stylesheet" href="dang-nhap.css">
</head>
<body>

        <div class="left-logo">
            <img src="../imgs/Group 18161.png" alt="" srcset="">
            <h1 class="tagline">Hệ thống quản lý chat đa nền tảng</h1>
            <p class="subtitle">Tiết kiệm thời gian tư vấn và chăm sóc khách hàng</p>
            <div class="dots">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="right">
            <form action="" class="form-login" id="form-login" novalidate>
                <img src="../imgs/vss-logo.png" alt="" srcset="">
                <h2>Đăng nhập vào tài khoản của bạn</h2>


                <div class="form">
                    <input type="text" name="email" id="email" placeholder="Nhập tài khoản">
                    <span class="error-message" id="email-error"></span>

                    <div class="password-wrapper">
                        <input type="password" name="password" id="password" placeholder="Nhập mật khẩu">
                        <button type="button" id="toggle-password" class="toggle-password" aria-label="Hiện mật khẩu">👁</button>
                    </div>
                    <span class="error-message" id="password-error"></span>

                    <div class="act-pw">
                        <div class="save-pw">
                            <input type="checkbox" name="" id="save-password">
                            <label for="save-password">Lưu mật khẩu </label>
                        </div>

                        <a href="quen-mat-khau.html" id="forget-pw">Quên mật khẩu </a>
                    </div>

                    <span class="error-message" id="form-error"></span>
                    <button type="submit" class="btn-register" id="btn-login">Đăng nhập</button>

                </div>

                <div class="to-login">
                    <p>Bạn chưa có tài khoản?</p>
                    <a href="dang-ky.html" id="link-login">Đăng ký</a>
                </div>

            </form>

            <div class="doi-nn">
                <img src="../imgs/qua-cau.png" alt="VN">
                <span>Tiếng Việt</span>
                <span class="arrow">▼</span>
            </div>

        </div>

</body>
</html>
