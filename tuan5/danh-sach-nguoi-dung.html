<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách người dùng</title>
    <link rel="stylesheet" href="danh-sach-nguoi-dung.css">
</head>
<body>

    <header class="topbar">
        <img src="../imgs/vss-logo.png" alt="" class="logo">
        <h1>Danh sách người dùng</h1>
        <a href="dang-nhap.html" class="btn-logout">Đăng xuất</a>
    </header>

    <main class="content">
        <div class="toolbar">
            <button type="button" id="btn-add-user" class="btn-primary">+ Thêm người dùng</button>
        </div>

        <table class="user-table">
            <thead>
                <tr>
                    <th>Avatar</th>
                    <th>Email</th>
                    <th>First name</th>
                    <th>Last name</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
        </table>
    </main>

    <div class="modal-overlay" id="user-modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Thêm người dùng</h2>
            <form id="user-form" novalidate>
                <input type="hidden" id="user-id">

                <label for="user-email">Email</label>
                <input type="email" id="user-email" placeholder="ten@example.com" required>
                <span class="error-message" id="user-email-error"></span>

                <label for="user-first-name">First name</label>
                <input type="text" id="user-first-name" placeholder="First name" required>
                <span class="error-message" id="user-first-name-error"></span>

                <label for="user-last-name">Last name</label>
                <input type="text" id="user-last-name" placeholder="Last name" required>
                <span class="error-message" id="user-last-name-error"></span>

                <label for="user-avatar">Avatar (URL)</label>
                <input type="text" id="user-avatar" placeholder="https://...">

                <div class="modal-actions">
                    <button type="button" id="btn-cancel" class="btn-secondary">Hủy</button>
                    <button type="submit" class="btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="danh-sach-nguoi-dung.js"></script>
</body>
</html>
